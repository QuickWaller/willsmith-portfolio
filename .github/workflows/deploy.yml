name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-contributions.mjs
        env:
          CONTRIB_READ_TOKEN: ${{ secrets.CONTRIB_READ_TOKEN }}
          CONTRIB_READ_TOKEN_2: ${{ secrets.CONTRIB_READ_TOKEN_2 }}
          CONTRIB_READ_TOKEN_3: ${{ secrets.CONTRIB_READ_TOKEN_3 }}
      # Lines-added/removed chart is disabled (SHOW_CODE_CHANGES = false in
      # Activity.tsx) until CONTRIB_READ_TOKEN*/_2/_3 get repo/Contents:Read
      # scope — no point spending CI time and API calls on data nothing reads.
      # - run: node scripts/fetch-code-changes.mjs
      #   env:
      #     CONTRIB_READ_TOKEN: ${{ secrets.CONTRIB_READ_TOKEN }}
      #     CONTRIB_READ_TOKEN_2: ${{ secrets.CONTRIB_READ_TOKEN_2 }}
      #     CONTRIB_READ_TOKEN_3: ${{ secrets.CONTRIB_READ_TOKEN_3 }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
